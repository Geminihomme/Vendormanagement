# NGINX CONFIGURATION FOR PRODUCTION
# ====================================
# Nginx is the web server that serves our React app to browsers.
# Think of it as the "bookshelf" that holds copies of our published book
# and hands them to anyone who walks in.
#
# WHY WE NEED THIS (instead of the default nginx config):
# 1. React uses client-side routing (/vendors, /contracts, etc.)
#    Without this config, refreshing on /vendors would show a 404 error.
#    The "try_files" directive below fixes this.
# 2. Gzip compression makes pages load faster (like zipping files before emailing).
# 3. Cache headers tell browsers to remember static files so they load instantly on repeat visits.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression: shrinks text files by ~70% before sending to the browser.
    # A 500KB JavaScript file becomes ~150KB. Faster loading for your users.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # Static assets (JS, CSS, images) have unique filenames from React's build process,
    # so we can tell browsers to cache them for 1 year. If the file changes, React
    # gives it a new name, so browsers automatically get the new version.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # For all other requests: try to serve a matching file.
    # If no file matches (like /vendors or /contracts), serve index.html instead.
    # This is what makes React Router work — the React JavaScript handles the routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
