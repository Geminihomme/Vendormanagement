<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vendor Management Platform</title>
    <!--
      This is the ONE HTML file in our entire React app.

      React is a "Single Page Application" (SPA) framework.
      That means: the browser loads this ONE page, and then React
      dynamically swaps content in and out using JavaScript.

      When you "navigate" to different pages, you're not actually
      loading new HTML files -- React is just changing what's displayed
      inside the <div id="root"> below.
    -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      React will inject our entire application into this empty div.
      Everything you see on screen lives inside this single element.
    -->
  </body>
</html>
